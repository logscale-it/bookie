name: Pages

# Build the SvelteKit site in site/ and deploy it to GitHub Pages.
# Deploys only when site/ (or this workflow) changes on master, plus manually.
# Download links use releases/latest, so release tags need no redeploy.
on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build site
        working-directory: site
        run: bun run build
        env:
          BASE_PATH: /bookie
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build
      - id: deployment
        uses: actions/deploy-pages@v4
