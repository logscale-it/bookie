name: Release

# Started by hand only (Actions → Release → Run workflow, with an existing tag).
# Both builds use the `release` environment, which requires a reviewer: GitHub asks
# once ("Review deployments"), and on approval both platforms build in parallel:
#   build    macOS + Windows at once: build, sign (Apple Developer ID + notarization
#            on macOS, Tauri updater key everywhere), upload the bundles as artifacts.
#            Builds never touch the GitHub release, so nothing races.
#   publish  one job: create or reuse the draft for the tag, upload every file,
#            write latest.json (updater manifest) once from the .sig files, prove
#            the draft complete with scripts/release-check.sh, then publish.
# A published release is immutable, so nothing goes public before the check passes.
# A failed run can be re-run: the draft is reused and its files are replaced.
# To release: bump versions (package.json, Cargo.toml, tauri.conf.json), merge, push
# tag vX.Y.Z, then run this workflow on GitHub with that tag and approve the deployment.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (must already exist and match the app version)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    environment: release # holds TAURI_SIGNING_*; required reviewer, one approval covers both builds
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-latest
            bundles: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - platform: windows-latest
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi*
              src-tauri/target/release/bundle/nsis/*.exe*

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check tag matches app version
        shell: bash
        run: scripts/release-check.sh versions "$TAG"

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and sign
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Developer ID .p12, base64) + notarization. The
          # bundler imports the cert into a temporary keychain; Windows ignores these.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The bundler notarizes the .app inside; the .dmg people download is notarized
      # here too, so opening it raises no Gatekeeper prompt. stapler fails if Apple
      # rejected it (no ticket), which stops the release.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="$(ls src-tauri/target/release/bundle/dmg/*.dmg)"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist

      - name: Collect files and write latest.json
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mkdir out
          find dist -type f -exec cp {} out/ \;
          # Release names (as tauri-action used): the macOS updater bundle carries the arch.
          mv out/bookie.app.tar.gz out/bookie_aarch64.app.tar.gz
          mv out/bookie.app.tar.gz.sig out/bookie_aarch64.app.tar.gz.sig
          # Version-free copies, so the website can link releases/latest/download/<name>.
          cp "out/bookie_${ver}_aarch64.dmg" out/bookie_aarch64.dmg
          cp "out/bookie_${ver}_x64_en-US.msi" out/bookie_x64_en-US.msi
          mac="bookie_aarch64.app.tar.gz" msi="bookie_${ver}_x64_en-US.msi" nsis="bookie_${ver}_x64-setup.exe"
          jq -n --arg v "$ver" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg base "$base" \
            --arg mac "$mac" --arg msi "$msi" --arg nsis "$nsis" \
            --rawfile macsig "out/$mac.sig" --rawfile msisig "out/$msi.sig" --rawfile nsissig "out/$nsis.sig" '
            def e(f; s): {signature: s, url: "\($base)/\(f)"};
            {version: $v, notes: "", pub_date: $date, platforms: {
              "darwin-aarch64": e($mac; $macsig), "darwin-aarch64-app": e($mac; $macsig),
              "windows-x86_64": e($msi; $msisig), "windows-x86_64-msi": e($msi; $msisig),
              "windows-x86_64-nsis": e($nsis; $nsissig)}}' > out/latest.json
          ls -l out

      - name: Create or reuse the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')"
          count="$(grep -c . <<<"$existing" || true)"
          if [ "$count" -eq 0 ]; then
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Bookie $TAG" -F draft=true -F prerelease=false --jq .id)"
          elif [ "$count" -eq 1 ] && [ "${existing#* }" = "true" ]; then
            id="${existing% *}"
            echo "Reusing existing draft $id"
          else
            echo "::error::A release for $TAG already exists and is not a single draft:"
            echo "$existing"
            echo "A published release is immutable and cannot be completed. Use a new version."
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

      - name: Upload files to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --paginate --jq '.[] | "\(.id) \(.name)"')"
          for f in out/*; do
            name="${f##*/}"
            # A re-run replaces what an earlier attempt left behind.
            old="$(awk -v n="$name" '$2 == n {print $1}' <<<"$assets")"
            [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" > /dev/null
            echo "uploaded $name"
          done

      - name: Verify the draft is complete
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: scripts/release-check.sh assets "$TAG" "$RELEASE_ID"

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
          rows="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')"
          [ "$rows" = "$RELEASE_ID false" ] || { echo "::error::Expected exactly one published release ($RELEASE_ID) for $TAG, found:"; echo "$rows"; exit 1; }
