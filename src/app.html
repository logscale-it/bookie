<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookie</title>
    <!-- The Tauri window is transparent (macOS vibrancy). Paint an opaque
         backdrop until the shell mounts; the layout adds `.vibrancy` on macOS
         only, which lets the sidebar show the native material through. -->
    <style>
      html { background: #f4f4f5; }
      @media (prefers-color-scheme: dark) { html { background: #18181b; } }
      html.dark { background: #18181b; }
      html.vibrancy { background: transparent; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
